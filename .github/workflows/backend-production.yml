name: Deploy to Production (Backend)

on:
  release:
    types:
      - published
    branches:
      - main

jobs:
  backend-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Ruff and run lint
      - uses: astral-sh/ruff-action@v3
        with:
          args: check

  backend-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy to Render (staging)
        if: github.ref == 'refs/heads/main'
        env:
          deploy_url: ${{ secrets.BACKEND_RENDER_PROD_DEPLOY_HOOK_URL }}
        run: |
          curl "$deploy_url"
