name: Deploy to Production (Backend)

on:
  release:
    types:
      - published
    branches:
      - main

jobs:
  backend-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Ruff and run lint
        uses: astral-sh/ruff-action@v3
        with:
          args: check

  backend-build-image:
    runs-on: ubuntu-latest
    needs: backend-lint

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.event.release.tag_name }}
            ghcr.io/${{ github.repository }}/backend:latest

  backend-deploy:
    runs-on: ubuntu-latest
    needs: backend-build-image

    steps:
      - name: Deploy to Render (production)
        env:
          deploy_url: ${{ secrets.BACKEND_RENDER_PROD_DEPLOY_HOOK_URL }}
        run: |
          curl -f "$deploy_url"
