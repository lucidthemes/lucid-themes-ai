name: Deploy to Production

on:
  release:
    types:
      - published
    branches:
      - main

jobs:
  frontend-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-lint

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

  frontend-deploy:
    runs-on: ubuntu-latest
    needs: frontend-build

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Deploy to Vercel (production)
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.FRONTEND_VERCEL_TOKEN }}
          vercel-args: --prod
          vercel-org-id: ${{ secrets.FRONTEND_VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.FRONTEND_VERCEL_PROD_PROJECT_ID }}
          working-directory: ./

  backend-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy to Render (staging)
        if: github.ref == 'refs/heads/main'
        env:
          deploy_url: ${{ secrets.BACKEND_RENDER_PROD_DEPLOY_HOOK_URL }}
        run: |
          curl "$deploy_url"
