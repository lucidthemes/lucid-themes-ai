name: CI (Backend)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Ruff and run lint
        uses: astral-sh/ruff-action@v3
        with:
          args: check
