name: Deploy to Staging (Frontend)

on:
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  frontend-build-image:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:pr-${{ github.event.pull_request.number }}
            ghcr.io/${{ github.repository }}/frontend:staging

  frontend-deploy:
    runs-on: ubuntu-latest
    needs: frontend-build-image

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Deploy to Vercel (staging)
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.FRONTEND_VERCEL_TOKEN }}
          vercel-args: --prod
          vercel-org-id: ${{ secrets.FRONTEND_VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.FRONTEND_VERCEL_STAGING_PROJECT_ID }}
          working-directory: ./
