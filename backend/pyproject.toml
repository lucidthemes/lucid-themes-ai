[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.4",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py314"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes (essential bug/error detection)
    "I",    # isort (automatic import sorting)
    "UP",   # pyupgrade (upgrades syntax to your target-version)
    "B",    # flake8-bugbear (common design flaws & design bugs)
    "SIM",  # flake8-simplify (helps write simpler, cleaner code)
    "RUF",  # Ruff-specific rules
]

ignore = [
    "E501", # Line too long (handled automatically by ruff formatter anyway)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true # Enable automatic formatting of code snippets trapped inside your docstrings
