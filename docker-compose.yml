services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"

    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - .venv/

        - action: rebuild
          path: ./backend/pyproject.toml

        - action: rebuild
          path: ./backend/uv.lock